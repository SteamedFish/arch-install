# shellcheck shell=bash
# profiles/server.conf — 无头服务器预设
# VPS 用法:--skip-modules hardware(见 README)
MODULES=(
    base
    pacman
    growfs
    mem-zswap       # 内存选项:无 swap=删除本行;zram=换成 mem-zram(互斥)
    auditd          # 默认 enable auditd.service(kernel audit listener,减少 dmesg 污染)
    ssh
    cli-tools
    dev-tools
    security
    filesystems
    chrony
    sysctl
    firewall
    network-networkd
    hardware
    monitoring
    docker
    backup
)
