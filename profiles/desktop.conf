# shellcheck shell=bash
# profiles/desktop.conf — 桌面预设
# $DESKTOP 由 --desktop 传入(niri|kde),解析时替换为 desktop-$DESKTOP;
# GPU 驱动不默认安装,用 --extra-modules gpu-amd 或 config MY_GPU_MODULES 选择
MODULES=(
    base
    pacman
    growfs
    mem-zswap       # 内存选项:无 swap=删除本行;zram=换成 mem-zram(互斥)
    auditd          # 默认 enable auditd.service(kernel audit listener,减少 dmesg 污染)
    ssh
    cli-tools
    dev-tools
    security
    filesystems
    chrony
    sysctl
    firewall
    network-nm
    hardware
    monitoring
    docker
    backup
    desktop
)
